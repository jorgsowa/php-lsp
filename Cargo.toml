[package]
name = "php-lsp"
version = "0.22.0"
edition = "2024"
description = "A PHP Language Server Protocol implementation"
license = "MIT"
repository = "https://github.com/jorgsowa/php-lsp"
readme = "README.md"
exclude = [
    "documentation/",
    "tests/fixtures/",
    ".github/",
    "scripts/",
    "ROADMAP.md",
]

[lib]
name = "php_lsp"
path = "src/lib.rs"

[[bin]]
name = "php-lsp"
path = "src/main.rs"

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "index"
harness = false

[[bench]]
name = "requests"
harness = false

[[bench]]
name = "semantic"
harness = false

[features]
dhat-heap = ["dep:dhat"]

[dependencies]
dhat = { version = "0.3", optional = true }
mimalloc = { version = "0.1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
mir-analyzer = { version = "0.65.0", git = "https://github.com/jorgsowa/mir" }
mir-issues = { version = "0.65.0", git = "https://github.com/jorgsowa/mir" }
mir-codebase = { version = "0.65.0", git = "https://github.com/jorgsowa/mir" }
mir-types = { version = "0.65.0", git = "https://github.com/jorgsowa/mir" }
php-rs-parser = "0.18"
php-ast = "0.18"
bumpalo = { version = "3", features = ["collections"] }
tower-lsp-server = "0.23"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
blake3 = "1"
dashmap = "6"
rayon = "1"
aho-corasick = "1"
salsa = "=0.28.1"
arc-swap = "1"
percent-encoding = "2"

[dependencies.walkdir]
version = "2"

[dev-dependencies]
tempfile = "3"
expect-test = "1"
indexmap = "2"
criterion = { version = "0.8", features = ["html_reports"] }
iai-callgrind = "0.16"
serial_test = "3"

[[bench]]
name = "iai_critical"
harness = false

[[bench]]
name = "edit_latency"
harness = false

[[bench]]
name = "references_degradation"
harness = false

[[bench]]
name = "references_scaling"
harness = false

[[bench]]
name = "references_scaling_static"
harness = false

[[bench]]
name = "republish_scaling"
harness = false

[[bench]]
name = "start_time"
harness = false

[[bench]]
name = "cross_file_freshness"
harness = false

[[bench]]
name = "rss_session"
harness = false

[[bench]]
name = "rss_churn"
harness = false

[[bench]]
name = "code_lens_scaling"
harness = false

# Faster local iteration: line-tables-only debuginfo keeps backtraces (file +
# line) while cutting the debuginfo codegen + link time that dominates the
# php-lsp test build.
[profile.dev]
debug = "line-tables-only"

# Optimize CPU-heavy dependencies in debug/test builds so the test suite
# stays fast without requiring a full release build.  These crates do the
# bulk of the parser and type-inference work; opt-level=1 gives most of the
# runtime speedup (typically 5-10×) at a fraction of the compile time cost
# of opt-level=3.
[profile.dev.package.mir-analyzer]
opt-level = 2
[profile.dev.package.mir-codebase]
opt-level = 2
[profile.dev.package.php-rs-parser]
opt-level = 2
[profile.dev.package.php-ast]
opt-level = 2
[profile.dev.package.php-lexer]
opt-level = 2
[profile.dev.package.salsa]
opt-level = 2
[profile.dev.package.salsa-macro-rules]
opt-level = 2

