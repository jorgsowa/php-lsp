[package]
name = "php-lsp"
version = "0.28.0"
edition = "2024"
description = "A PHP Language Server Protocol implementation"
license = "MIT"
repository = "https://github.com/jorgsowa/php-lsp"
readme = "README.md"
exclude = [
    "documentation/",
    "tests/fixtures/",
    ".github/",
    "scripts/",
    "ROADMAP.md",
]

[lib]
name = "php_lsp"
path = "src/lib.rs"

[[bin]]
name = "php-lsp"
path = "src/main.rs"

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "index"
harness = false

[[bench]]
name = "requests"
harness = false

[[bench]]
name = "semantic"
harness = false

[features]
dhat-heap = ["dep:dhat"]
# Debug-gate hold points for the responsiveness regression tests. Never in
# production builds: the self dev-dependency below enables it for test
# targets only, so plain `cargo build` compiles the hooks out entirely.
test-hooks = []

[dependencies]
dhat = { version = "0.3", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
mir-analyzer = "0.88.0"
mir-issues = "0.88.0"
mir-codebase = "0.88.0"
mir-types = "0.88.0"
php-rs-parser = "0.21"
php-ast = "0.21"
php-lexer = "0.21"
bumpalo = { version = "3", features = ["collections"] }
tower-lsp-server = "0.23"
tower = "0.5"
# Only what builds for wasm32; the server's `fs`, `process`, `net`, `signal` come in below, off wasm.
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
blake3 = "1"
dashmap = "6"
rayon = "1"
salsa = "=0.28.5"
arc-swap = "1"
percent-encoding = "2"

# The language server itself (`backend`, the workspace scan, external phpstan/phpcs) needs all of tokio,
# and its allocator, `mimalloc`, is C: the library alone has no C in it on wasm.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }
tokio = { version = "1", features = ["full"] }

# `killpg` for external tools' process groups.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies.walkdir]
version = "2"

[dev-dependencies]
# Self-dependency: turns on test-hooks whenever test/bench targets build,
# without affecting `cargo build` of the binary.
php-lsp = { path = ".", features = ["test-hooks"] }
tempfile = "3"
expect-test = "1"
indexmap = "2"
criterion = { version = "0.8", features = ["html_reports"] }
iai-callgrind = "0.16"
serial_test = "4"

[[bench]]
name = "iai_critical"
harness = false

[[bench]]
name = "edit_latency"
harness = false

[[bench]]
name = "references_degradation"
harness = false

[[bench]]
name = "references_scaling"
harness = false

[[bench]]
name = "references_scaling_static"
harness = false

[[bench]]
name = "republish_scaling"
harness = false

[[bench]]
name = "start_time"
harness = false

[[bench]]
name = "cross_file_freshness"
harness = false

[[bench]]
name = "rss_session"
harness = false

[[bench]]
name = "rss_churn"
harness = false

[[bench]]
name = "code_lens_scaling"
harness = false

[[bench]]
name = "references_all_kinds"
harness = false

# Faster local iteration: line-tables-only debuginfo keeps backtraces (file +
# line) while cutting the debuginfo codegen + link time that dominates the
# php-lsp test build.
[profile.dev]
debug = "line-tables-only"

# Optimize CPU-heavy dependencies in debug/test builds so the test suite
# stays fast without requiring a full release build.  These crates do the
# bulk of the parser and type-inference work; opt-level=1 gives most of the
# runtime speedup (typically 5-10×) at a fraction of the compile time cost
# of opt-level=3.
[profile.dev.package.mir-analyzer]
opt-level = 2
[profile.dev.package.mir-codebase]
opt-level = 2
[profile.dev.package.php-rs-parser]
opt-level = 2
[profile.dev.package.php-ast]
opt-level = 2
[profile.dev.package.php-lexer]
opt-level = 2
[profile.dev.package.salsa]
opt-level = 2
[profile.dev.package.salsa-macro-rules]
opt-level = 2
