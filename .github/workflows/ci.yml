name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.5"
          tools: none

      - name: Run tests
        timeout-minutes: 20
        run: cargo test

  install:
    name: cargo install (unlocked)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.98.1"

      - name: cargo install without --locked
        run: cargo install --path . --debug

      - name: Verify binary
        run: php-lsp --version

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

  # The library (not the server) also builds for WASI, which has no threads, files or child
  # processes, so the analysis can run in a browser worker. `cargo check` only: it is what keeps a
  # change from breaking that unnoticed. Nothing in the library is C on that target, so no
  # toolchain beyond the target itself.
  wasm:
    name: Check library (wasm32-wasip1)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.98.1"
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: Check the library
        run: cargo check --lib --target wasm32-wasip1
        env:
          RUSTFLAGS: -D warnings
