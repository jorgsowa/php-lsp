name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.5"
          tools: none

      - name: Run tests
        timeout-minutes: 20
        run: cargo test

  install:
    name: cargo install (unlocked)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.98.1"

      - name: cargo install without --locked
        run: cargo install --path . --debug

      - name: Verify binary
        run: php-lsp --version

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy -- -D warnings

  # The library (not the server) also builds for WASI, which has no threads, files or child
  # processes, so the analysis can run in a browser worker. `cargo check` only: it is what keeps a
  # change from breaking that unnoticed. Nothing in the library is C on that target, so no
  # toolchain beyond the target itself.
  wasm:
    name: Check library (wasm32-wasip1)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.98.1"
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: Check the library
        run: cargo check --lib --target wasm32-wasip1
        env:
          RUSTFLAGS: -D warnings

  # The `php-lsp-wasm` reactor (wasm/): the library's completion, hover and signature help behind a C
  # ABI, the module a browser worker loads. It calls modules the library makes public only on wasm,
  # so it is linted and tested on that target, its tests under wasmtime.
  wasm-reactor:
    name: Reactor (wasm32-wasip1)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.98.1"
          targets: wasm32-wasip1
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: "50.0.3"

      - name: Clippy
        run: cargo clippy -p php-lsp-wasm --target wasm32-wasip1 -- -D warnings

      - name: Run tests
        run: cargo test -p php-lsp-wasm --target wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime

      - name: Build
        run: cargo build -p php-lsp-wasm --target wasm32-wasip1
